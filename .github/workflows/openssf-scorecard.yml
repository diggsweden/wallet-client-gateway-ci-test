name: OpenSSF Scorecard Analysis
on:
  schedule:
    # Saturdays at 02:35 UTC
    - cron: "35 2 * * 6"
    # Wednesdays at 02:35 UTC
    - cron: "35 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard-analysis:
    permissions:
      contents: read
      id-token: write
    uses: diggsweden/reusable-ci/.github/workflows/security-openssf-scorecard.yml@fa23c718c0621c668c8b35666e0d31ea3a3ad357 # v3 candidate
    secrets:
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    with:
      reusable-ci-ref: fa23c718c0621c668c8b35666e0d31ea3a3ad357
      publish-results: false # Keep CI-test results out of the public Scorecard API.
